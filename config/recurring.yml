# Recurring jobs — see https://github.com/rails/solid_queue#recurring-tasks
#
# Add your own like:
#   nightly_report:
#     class: MyReportJob
#     queue: spree_reports
#     schedule: at 5am every day
production:
  # Release checkout stock reservations whose hold expired, so inventory
  # returns to sellable stock promptly.
  expire_stock_reservations:
    class: Spree::StockReservations::ExpireJob
    schedule: every minute

  # Prune EU Omnibus price history past the retention period
  # (Spree::Config[:price_history_retention_days], default 30).
  prune_price_history:
    command: "Spree::PriceHistory.where('recorded_at < ?', (Spree::Config[:price_history_retention_days] || 30).days.ago).in_batches(of: 1000).delete_all"
    schedule: at 4am every day

  # Marketplace payouts. The sweep hands every approved seller to a job of its
  # own, which decides whether that seller is actually due — a scheduler cannot
  # express "weekly, but from whenever this seller was last paid". Both are a
  # cheap no-op on a store with no sellers, so they are safe to leave enabled.
  sweep_due_seller_payouts:
    class: Spree::SellerPayouts::SweepDueJob
    schedule: at 3am every day

  # Retries earnings a payout provider refused — usually a passing failure.
  execute_pending_seller_transfers:
    class: Spree::SellerTransfers::ExecutePendingDueJob
    schedule: every hour at minute 27

  # Solid Queue / Solid Cable housekeeping.
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  clear_solid_cable_messages:
    command: "SolidCable::Message.prunable.in_batches(of: 1000).delete_all"
    schedule: every hour at minute 42
